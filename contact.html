<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Cinzel:wght@600&family=Playfair+Display:wght@600;700&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">

<style>

/* ================= BASE ================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins', sans-serif;
}

body{
  background:#0f0f0f;
  color:#ccc;
  overflow-x:hidden;
  line-height:1.8;

  opacity:0;
  transition:0.6s ease-in-out;
}

body.fade-in{
  opacity:1;
}

body.fade-out{
  opacity:0;
  filter:blur(5px);
}

/* ================= HEADER ================= */
header{
  position:fixed;
  top:0;
  width:100%;
  padding:18px 50px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(0,0,0,0.85);
  backdrop-filter:blur(10px);
  z-index:1000;
}

/* LOGO */
.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

/* BLINKING EYE */
.eye{
  font-size:22px;
  color:#f5c542;
  text-shadow:0 0 10px rgba(245,197,66,0.8);
  animation:blinkEye 3.5s infinite;
  display:inline-block;
}

/* eye blink */
@keyframes blinkEye{
  0%, 92%, 100%{
    transform:scaleY(1);
  }
  94%, 96%{
    transform:scaleY(0.1);
  }
}

/* BRAND */
.logo span{
  font-family:'Cinzel', serif;
  font-weight:600;
  letter-spacing:3px;
  font-size:18px;

  background:linear-gradient(90deg,#f5c542,#fff2b0);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* NAV */
nav a{
  margin-left:25px;
  text-decoration:none;
  font-family:'Cinzel', serif;
  font-size:14px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:#ddd;
  position:relative;
  transition:0.3s;
}

nav a:hover{
  color:#f5c542;
  text-shadow:0 0 8px rgba(245,197,66,0.7);
}

nav a::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-6px;
  width:0%;
  height:2px;
  background:linear-gradient(90deg,#f5c542,#fff2b0);
  transition:0.3s;
}

nav a:hover::after{
  width:100%;
}

/* ================= SECTION ================= */
section{
  max-width:650px;
  margin:140px auto 60px;
  padding:0 20px;
  text-align:center;
}

/* TITLE */
section h3{
  font-family:'Playfair Display', serif;
  font-size:38px;
  margin-bottom:30px;

  background:linear-gradient(90deg,#f5c542,#fff2b0);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  animation:glow 2.5s infinite alternate;
}

/* GLOW */
@keyframes glow{
  from{
    text-shadow:0 0 10px rgba(245,197,66,0.5);
  }
  to{
    text-shadow:0 0 30px rgba(245,197,66,1);
  }
}

/* ================= FORM ================= */
form{
  display:flex;
  flex-direction:column;
  gap:15px;

  background:#1a1a1a;
  padding:30px;
  border-radius:12px;

  box-shadow:0 0 20px rgba(245,197,66,0.1);
}

input, textarea{
  padding:12px;
  border:none;
  border-radius:6px;

  background:#1c1c1c;
  color:white;
  font-size:16px;

  transition:0.3s;
}

input:focus, textarea:focus{
  outline:none;
  background:#2a2a2a;
  box-shadow:0 0 12px rgba(245,197,66,0.6);
}

textarea{
  resize:none;
  min-height:130px;
}

/* BUTTON */
button{
  padding:12px;
  border:none;
  border-radius:6px;
  background:#c9a24d;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:#f5c542;
  color:#111;
  box-shadow:0 0 15px rgba(245,197,66,0.6);
}

/* FOOTER */
footer{
  text-align:center;
  padding:20px;
  background:black;
  color:#777;
}

/* ================= MOBILE ================= */
@media (max-width:768px){

  header{
    padding:15px 20px;
  }

  nav a{
    margin-left:12px;
    font-size:12px;
  }

  section h3{
    font-size:26px;
  }

  form{
    padding:20px;
  }

  input, textarea{
    font-size:14px;
  }
}

</style>
</head>

<body>

<header>
  <div class="logo">
    <span class="eye">👁</span>
    <span>PORTFOLIO</span>
  </div>

<nav>
  <a href="index.html">Home</a>
  <a href="portfolio.html">Portfolio</a>
  <a href="about.html">About</a>
  <a href="trips.html">Trips</a>
  <a href="contact.html">Contact</a>

  <a href="login.html" id="loginLink">Login</a>
  <a href="#" id="logoutLink" onclick="logout()" style="display:none;">Logout</a>
</nav>
</header>

<section>
  <h3>LET'S COLLAB</h3>

  <form>
    <input type="text" placeholder="Your Name" required>
    <input type="email" placeholder="Your Email" required>
    <textarea placeholder="Message" required></textarea>
    <button type="submit">Send</button>
  </form>
</section>

<footer>© 2026 Reddy Photography ALL RIGHTS RESERVED</footer>

<script>
window.addEventListener("load", () => {
  document.body.classList.add("fade-in");
});

const isLoggedIn = localStorage.getItem("userLoggedIn") === "true";

const loginLink = document.getElementById("loginLink");
const logoutLink = document.getElementById("logoutLink");

if (isLoggedIn) {
  loginLink.style.display = "none";
  logoutLink.style.display = "inline";
} else {
  loginLink.style.display = "inline";
  logoutLink.style.display = "none";
}

function logout(){
  localStorage.clear();
  alert("Logged out!");
  window.location.href = "index.html";
}
</script>

</body>
</html>
