<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photography Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Cinzel:wght@600&family=Playfair+Display:wght@600;700&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
<script>
if(localStorage.getItem("loggedIn") !== "true"){
  window.location.href = "login.html";
}
</script>

<style>
/* ================= FOOTER ================= */
footer {
  position: relative;
  width: 100%;
  padding: 25px 20px;
  text-align: center;

  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(10px);

  color: #aaa;
  font-size: 14px;
  letter-spacing: 1px;

  border-top: 1px solid rgba(245,197,66,0.2);
  box-shadow: 0 -5px 20px rgba(245,197,66,0.1);
}

/* small highlight text */
footer span {
  color: #f5c542;
}
.hero {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  position: relative;
  overflow: hidden;
  padding-top: 80px;

  /* ADD THIS */
  background: url('https://images.unsplash.com/photo-1516035069371-29a1b244cc32?q=80&w=764&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D')
              center/cover no-repeat;
}

/* Optional dark overlay for better text readability */
.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 0;
}

/* Keep text above overlay */
.hero > * {
  position: relative;
  z-index: 1;
}
/* ================= HERO BASE ================= */
body {
  margin: 0;
  background: #0f0f0f;
  color: white;
  overflow-x: hidden;
  opacity: 0;
  transition: opacity 0.6s ease-in-out;
}

body.fade-in { 
  opacity: 1; 
}

body.fade-out { 
  opacity: 0; 
  filter: blur(5px); 
}

/* ================= HERO ================= */
.hero {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  position: relative;
  overflow: hidden;
  padding-top: 80px;
}

/* ================= MAIN TEXT ================= */
#mainText {
  font-family: 'Playfair Display', serif;
  font-size: 64px;
  background: linear-gradient(90deg, #f5c542, #fff2b0);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  transition: opacity 0.3s ease;
}

/* ================= GLITCH EFFECT ================= */
.glitch {
  animation: glitchCut 0.35s ease;
}

@keyframes glitchCut {
  0%   { opacity: 1; filter: blur(0); }
  25%  { opacity: 0.2; transform: scale(1.02); }
  50%  { opacity: 1; filter: blur(2px); }
  75%  { opacity: 0.4; }
  100% { opacity: 1; filter: blur(0); }
}

/* ================= SUB TEXT (CURSIVE) ================= */
#subText {
  font-family: 'Dancing Script', cursive;
  font-size: 26px;
  color: #d6d6d6;
  margin-top: 10px;
  opacity: 0;
  animation: fadeUp 1.2s ease forwards;
  animation-delay: 1s;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ================= BUTTON ================= */
button {
  margin-top: 25px;
  padding: 12px 28px;
  background: #c9a24d;
  border: none;
  cursor: pointer;
  font-weight: 600;
  font-size: 15px;
  color: #111;
  transition: 0.4s ease;
  border-radius: 4px;

  box-shadow: 0 0 10px rgba(245, 197, 66, 0.3);
  animation: glowPulse 2s infinite ease-in-out;
}

button:hover {
  background: #f5c542;
  box-shadow: 0 0 25px rgba(245, 197, 66, 0.9);
  transform: scale(1.05);
}

@keyframes glowPulse {
  0%   { box-shadow: 0 0 8px rgba(245,197,66,0.3); }
  50%  { box-shadow: 0 0 20px rgba(245,197,66,0.7); }
  100% { box-shadow: 0 0 8px rgba(245,197,66,0.3); }
}

header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;

  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 16px 50px;
  box-sizing: border-box;

  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(10px);

  z-index: 1000;
}

/* LOGO AREA */
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* BLINKING EYE */
.eye {
  font-size: 20px;
  animation: blinkEye 3s infinite;
  filter: drop-shadow(0 0 6px rgba(245, 197, 66, 0.8));
}

/* eye blink animation */
@keyframes blinkEye {
  0%, 92%, 100% { transform: scaleY(1); opacity: 1; }
  95% { transform: scaleY(0.1); opacity: 0.6; }
}
.eye{
  color:#f5c542;
  text-shadow:0 0 10px rgba(245,197,66,0.8);
}
/* CINEMATIC BRAND TEXT */
.brand {
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  letter-spacing: 4px;

  background: linear-gradient(90deg, #f5c542, #fff2b0, #c9a24d);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;

  text-shadow:
    0 0 10px rgba(245, 197, 66, 0.4),
    0 0 25px rgba(245, 197, 66, 0.2);

  animation: cinematicGlow 3s ease-in-out infinite alternate;
}

/* glow pulse */
@keyframes cinematicGlow {
  from {
    filter: drop-shadow(0 0 5px rgba(245,197,66,0.3));
  }
  to {
    filter: drop-shadow(0 0 18px rgba(245,197,66,0.8));
  }
}

/* NAV */
nav {
  display: flex;
  gap: 22px;
}

nav a {
  text-decoration: none;
  font-family: 'Cinzel', serif;
  font-size: 14px;
  color: #ddd;
  transition: 0.3s;
  position: relative;
}

/* cinematic underline hover */
nav a::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -4px;
  width: 0%;
  height: 1px;
  background: #f5c542;
  transition: 0.3s;
}

nav a:hover {
  color: #f5c542;
}

nav a:hover::after {
  width: 100%;
}
</style></head>
<body>

<header>
  <div class="logo">
    <span class="eye">👁</span>
    <span class="brand">PORTFOLIO</span>
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="about.html">About</a>
    <a href="trips.html">Trips</a>
    <a href="contact.html">Contact</a>
  <a href="login.html" id="loginLink">Login</a>
  <a href="#" id="logoutLink" onclick="logout()" style="display:none;">Logout</a>
  </nav>
</header>
<div class="hero">
  <h1 id="mainText">Capture The Moment</h1>
  <p id="subText">Where Photography Tells You Stories</p>
  <button onclick="location.href='portfolio.html'">View Portfolio</button>
</div>

<script>
const texts = [
  "Capture The Moment",
  "Freeze The Light",
  "Frame The Emotion",
  "Moments That Speak"
];

let i = 0;
const title = document.getElementById("mainText");

function glitchChange() {
  title.classList.add("glitch");

  setTimeout(() => {
    i = (i + 1) % texts.length;
    title.textContent = texts[i];
    title.classList.remove("glitch");
  }, 200);
}

setInterval(glitchChange, 2500);

// fade in
window.onload = () => document.body.classList.add("fade-in");
</script>
<footer>
  © 2026 <span>Reddy Photography</span> — All Rights Reserved <br>
  Crafted with Passion & Vision 📸
</footer>
</body>
</html>
